[package]
name = "rust-friends-calendar"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] } # util = ServiceExt::oneshot, used by functional tests
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
hyper = "1.0"

# 5.x required to get off reqwest 0.11 / hyper 0.14, which dragged in
# h2 0.3 (RUSTSEC-2026-0258) and rustls 0.21 -> rustls-webpki 0.101
# (RUSTSEC-2026-0098/0099/0104). 5.x uses reqwest 0.12, the same major this
# crate already depends on directly, so the two no longer diverge.
oauth2 = "5.0"
reqwest = { version = "0.12", features = ["json"] }
jsonwebtoken = "9"

# 0.8+ required by RUSTSEC-2024-0363 (binary protocol misinterpretation via
# truncating/overflowing casts, unfixed in the 0.7 line). 0.8 also split the
# old combined "runtime-tokio-native-tls" feature into separate runtime and
# TLS features, hence the two flags below rather than one.
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "uuid",
    "chrono",
] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

dotenvy = "0.15"
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

bcrypt = "0.15"

# Discord bot (gateway) for reaction-based RSVP tracking
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model"] }

[dev-dependencies]
wiremock = "0.6"
