server {
    listen 80;
    server_name ${domain};

    # CORS is handled entirely by the backend's own CorsLayer (backend/src/main.rs,
    # restricted to the real frontend origin, not a wildcard) - setting CORS
    # headers here too would mean the browser sees Access-Control-Allow-Origin
    # twice on the same response, which gets the response rejected outright.
    # Don't add CORS handling at this layer.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}