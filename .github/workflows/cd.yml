name: Deploy

# Runs only after CI has actually passed on master - not on every push
# independently, so this never re-runs the test/build steps CI already
# did and can never deploy something CI rejected. Terraform does NOT run
# here: infra provisioning is a deliberate, manual `make apply` step (see
# docs/deployment.md) - this workflow only ships a new binary to a
# container that's assumed to already exist.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

jobs:
  build:
    name: Build release binary
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Matches the container's OS (debian-12-standard / bookworm) so the
    # binary links against the same glibc it'll run against. Building on
    # plain ubuntu-latest (24.04, glibc 2.39) would produce a binary that
    # refuses to run on bookworm's older glibc (2.36).
    container: rust:1-bookworm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # -p, rather than `cd backend`: backend is a member of the root cargo
      # workspace, so the build output lands in the workspace's shared
      # target/ directory, not backend/target/. Building the one package we
      # actually ship keeps the Tauri desktop member out of the build.
      - name: Build release binary
        run: cargo build --release -p rust-friends-calendar

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-friends-calendar
          path: target/release/rust-friends-calendar
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: build
    # Self-hosted, and it has to be: the container lives behind NAT on a
    # home network, reachable from outside only through a Cloudflare tunnel,
    # and a proxied Cloudflare record carries HTTP/S - not SSH. A
    # GitHub-hosted runner has no route in at all. This runner sits on the
    # same LAN and connects outbound to GitHub, so nothing needs exposing.
    runs-on: self-hosted
    environment: production

    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: rust-friends-calendar
          path: ./artifact

      # Everything goes in the workspace, not ~/.ssh. On a GitHub-hosted
      # runner the whole machine is discarded afterwards; this runner is
      # persistent, so writing to ~/.ssh/known_hosts would append the same
      # host key on every deploy forever, and a private key left in $HOME
      # would outlive the job.
      - name: Configure SSH
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > "$RUNNER_TEMP/ssh/deploy_key"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key"
          ssh-keyscan -H "${{ secrets.DEPLOY_SSH_HOST }}" \
            > "$RUNNER_TEMP/ssh/known_hosts" 2>/dev/null
          test -s "$RUNNER_TEMP/ssh/known_hosts" || {
            echo "::error::ssh-keyscan returned nothing for DEPLOY_SSH_HOST - is the container up and reachable from this runner?"
            exit 1
          }

      - name: Ship binary and restart service
        run: |
          SSH_OPTS="-i $RUNNER_TEMP/ssh/deploy_key -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts -o IdentitiesOnly=yes"
          chmod +x ./artifact/rust-friends-calendar
          scp $SSH_OPTS \
            ./artifact/rust-friends-calendar \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:/opt/friends-calendar/target/release/rust-friends-calendar.new"

          # Atomic rename: a mid-transfer failure above never leaves a
          # half-written binary in the live path, and the running process
          # (if any) keeps its own open file handle to the old inode until
          # the restart below actually happens.
          #
          # Assumes DEPLOY_SSH_USER can restart the service and write to
          # /opt/friends-calendar without sudo - matches how
          # terraform/provisioning.tf and scripts/update.sh already
          # operate (root over SSH). If DEPLOY_SSH_USER isn't root, either
          # grant it passwordless sudo for these two commands specifically,
          # or add `sudo` back here - see docs/deployment.md.
          ssh $SSH_OPTS "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" '
            set -e
            mv /opt/friends-calendar/target/release/rust-friends-calendar.new /opt/friends-calendar/target/release/rust-friends-calendar
            systemctl restart friends-calendar
          '

      # The key is in RUNNER_TEMP, which the runner clears between jobs, but
      # this runner is a long-lived machine and a deploy key is worth being
      # explicit about. `always()` so a failed deploy doesn't leave it behind.
      - name: Remove deploy key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "https://${{ secrets.PROD_DOMAIN }}/"; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "⏳ Waiting for service... ($i/5)"
            sleep 10
          done
          echo "❌ Health check failed - service did not come back up after deploy"
          exit 1
