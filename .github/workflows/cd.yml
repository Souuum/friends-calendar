name: Deploy

# Runs only after CI has actually passed on master - not on every push
# independently, so this never re-runs the test/build steps CI already
# did and can never deploy something CI rejected. Terraform does NOT run
# here: infra provisioning is a deliberate, manual `make apply` step (see
# docs/deployment.md) - this workflow only ships a new binary to a
# container that's assumed to already exist.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

jobs:
  build:
    name: Build release binary
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Matches the container's OS (debian-12-standard / bookworm) so the
    # binary links against the same glibc it'll run against. Building on
    # plain ubuntu-latest (24.04, glibc 2.39) would produce a binary that
    # refuses to run on bookworm's older glibc (2.36).
    container: rust:1-bookworm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # -p, rather than `cd backend`: backend is a member of the root cargo
      # workspace, so the build output lands in the workspace's shared
      # target/ directory, not backend/target/. Building the one package we
      # actually ship keeps the Tauri desktop member out of the build.
      - name: Build release binary
        run: cargo build --release -p rust-friends-calendar

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-friends-calendar
          path: target/release/rust-friends-calendar
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: build
    # Self-hosted, and it has to be: the container lives behind NAT on a home
    # network, reachable from outside only through a Cloudflare tunnel, and a
    # proxied Cloudflare record carries HTTP/S - not SSH (verified: 443 open,
    # 22 filtered). A GitHub-hosted runner has no route in at all.
    #
    # The runner is installed on the app container itself, so this job is
    # entirely local - see docs/deployment.md for the trade that makes: a
    # runner inside a down container cannot deploy its own fix, so recovery
    # is a manual SSH from the LAN.
    runs-on: self-hosted
    environment: production

    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: rust-friends-calendar
          path: ./artifact

      # No SSH: the runner lives on the app container itself, so installing
      # a build is a local file move. That removes the DEPLOY_SSH_HOST/USER/
      # KEY secrets entirely - there is no network hop left to authenticate.
      - name: Install binary and restart service
        run: |
          set -euo pipefail
          RELEASE_DIR=/opt/friends-calendar/target/release
          TARGET="$RELEASE_DIR/rust-friends-calendar"

          # Write beside the target, then rename. `mv` within one filesystem
          # is atomic, so an interrupted copy can never leave a half-written
          # binary in the live path - and the running process keeps its own
          # handle on the old inode until the restart below.
          install -m 755 ./artifact/rust-friends-calendar "$TARGET.new"
          mv "$TARGET.new" "$TARGET"

          # sudo because the GitHub runner refuses to be configured as root
          # (config.sh rejects it), so it runs unprivileged and needs an
          # explicit, single-command sudoers rule. provision-container.sh
          # installs both that rule and the directory ownership.
          sudo systemctl restart friends-calendar

      # Two checks, because they fail for different reasons and the
      # distinction is the whole diagnostic: local proves the binary starts
      # and the migrations ran, public proves the tunnel still routes to it.
      - name: Health check (local)
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 5 http://127.0.0.1:8080/ >/dev/null; then
              echo "✅ Service is up locally"
              exit 0
            fi
            echo "⏳ Waiting for the service to come up... ($i/5)"
            sleep 5
          done
          echo "::error::The service did not start. Recent logs:"
          sudo journalctl -u friends-calendar -n 50 --no-pager || true
          exit 1

      - name: Health check (through the tunnel)
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "https://${{ secrets.PROD_DOMAIN }}/"; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "⏳ Waiting for service... ($i/5)"
            sleep 10
          done
          echo "❌ Health check failed - service did not come back up after deploy"
          exit 1
