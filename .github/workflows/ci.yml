name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # No `workspaces: backend` - backend is a member of the root cargo
      # workspace, so build output goes to the shared root target/, which is
      # what this action needs to cache.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: |
          cd backend
          cargo fmt --all -- --check

      - name: Clippy
        run: |
          cd backend
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          JWT_SECRET: test_secret_key_for_ci_only
          DISCORD_CLIENT_ID: test
          DISCORD_CLIENT_SECRET: test
          DISCORD_BOT_TOKEN: test
          DISCORD_ANNOUNCEMENT_CHANNEL_ID: "123"
        run: |
          cd backend
          cargo test --all-features

      - name: Build
        run: |
          cd backend
          cargo build --release

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Node 22, not 20: vitest declares engines.node "^22.12.0 || ^24.0.0 ||
      # >=26.0.0" and @testing-library/jest-dom declares ">=22". Yarn v1
      # treats an incompatible engines field as a hard error (npm only warns),
      # so `yarn install --frozen-lockfile` fails outright on Node 20 - which
      # is exactly what this job was doing.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: desktop/yarn.lock

      - name: Install dependencies
        run: |
          cd desktop
          yarn install --frozen-lockfile

      - name: Run tests
        run: |
          cd desktop
          yarn test --run

      - name: Type check
        run: |
          cd desktop
          yarn run check

      - name: Build
        run: |
          cd desktop
          yarn build

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      # Run from the repo root, not `cd backend`: the workspace has a single
      # authoritative Cargo.lock at the root, and cargo-audit does not walk
      # up to find one. The exception list lives in .cargo/audit.toml, which
      # is also only picked up from the working directory.
      - name: Run security audit
        run: cargo audit
